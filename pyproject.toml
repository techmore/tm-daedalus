[project]
name = "daedalus"
version = "0.1.0"
description = "A multi-tenant security operations portal for Cyber Security Pilot"
requires-python = ">=3.11"
dependencies = [
  "authlib>=1.6.9",
  "cryptography>=44",
  "dnspython>=2.7",
  "fastapi>=0.115",
  "httpx>=0.28",
  "jinja2>=3.1",
  "python-socketio[client]>=5.13",
  "python-dotenv>=1.0",
  "sqlalchemy>=2.0",
  "itsdangerous>=2.2",
  "uvicorn[standard]>=0.34",
  "reportlab>=4.4,<6",
]

[project.scripts]
daedalus-agent = "daedalus.agent:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-subtests>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daedalus"]
