services:
  daedalus:
    build: .
    image: daedalus:local
    env_file:
      - .env.production
    environment:
      DAEDALUS_ENV: production
      DAEDALUS_DEMO_MODE: "false"
      DAEDALUS_HOST: 0.0.0.0
      DAEDALUS_PORT: "8000"
      DAEDALUS_DATABASE_URL: sqlite:////data/daedalus.db
      DAEDALUS_REPORTS_DIR: /data/reports
    expose:
      - "8000"
    volumes:
      - daedalus_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os,urllib.parse,urllib.request; host=urllib.parse.urlparse(os.environ['DAEDALUS_BASE_URL']).netloc; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/healthz', headers={'Host':host}), timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  caddy:
    image: caddy:2-alpine
    environment:
      DAEDALUS_HOSTNAMES: ${DAEDALUS_HOSTNAMES:?Set DAEDALUS_HOSTNAMES in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      daedalus:
        condition: service_healthy
    restart: unless-stopped

volumes:
  daedalus_data:
  caddy_data:
  caddy_config:
