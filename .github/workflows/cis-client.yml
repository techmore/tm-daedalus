name: Test CIS macOS client

on:
  push:
    branches: [main]
    paths:
      - 'clients/csp-cis-audit/**'
      - '.github/workflows/cis-client.yml'
  pull_request:
    paths:
      - 'clients/csp-cis-audit/**'
      - '.github/workflows/cis-client.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cis-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-client:
    name: macOS unit tests and local package build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run client tests
        timeout-minutes: 15
        run: >-
          xcodebuild -quiet test
          -project clients/csp-cis-audit/CSP-CIS_Audit.xcodeproj
          -scheme CSP-CIS_Audit
          -destination 'platform=macOS'
          -resultBundlePath "$RUNNER_TEMP/cis-client-tests.xcresult"
          CODE_SIGNING_ALLOWED=NO

      - name: Retain native test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cis-client-test-results
          path: ${{ runner.temp }}/cis-client-tests.xcresult
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Assess real macOS 26 platform profile
        timeout-minutes: 10
        env:
          TEST_RUNNER_DAEDALUS_REAL_TAHOE_ASSESSMENT: '1'
          TEST_RUNNER_DAEDALUS_TAHOE_PROFILE_PATH: ${{ github.workspace }}/src/daedalus/profiles/cis-macos-26-tahoe-level-2.json
          TEST_RUNNER_DAEDALUS_TAHOE_RECEIPT_PATH: ${{ runner.temp }}/cis-tahoe-platform-receipt.json
        run: |
          xcodebuild -quiet test \
            -project clients/csp-cis-audit/CSP-CIS_Audit.xcodeproj \
            -scheme CSP-CIS_Audit -destination 'platform=macOS' \
            -only-testing:CSP-CIS_AuditTests/TahoeAdditionalCommandChecksTests \
            -resultBundlePath "$RUNNER_TEMP/cis-tahoe-platform.xcresult" \
            CODE_SIGNING_ALLOWED=NO
          test -s "$RUNNER_TEMP/cis-tahoe-platform-receipt.json"

      - name: Retain real platform assessment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cis-tahoe-platform-evidence
          path: |
            ${{ runner.temp }}/cis-tahoe-platform-receipt.json
            ${{ runner.temp }}/cis-tahoe-platform.xcresult
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Check notarized release script syntax
        run: |
          bash -n clients/csp-cis-audit/scripts/build-notarized-client.sh
          bash -n clients/csp-cis-audit/scripts/build-mdm-package.sh

      - name: Build credential-free local demo package
        timeout-minutes: 10
        run: sh clients/csp-cis-audit/scripts/build-local-client.sh "$RUNNER_TEMP/daedalus-cis-client"
