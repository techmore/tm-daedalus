name: Test Daedalus

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Check Python sources
        # Pinned tool run; the lockfile and production requirements stay unchanged.
        run: uvx ruff@0.14.1 check src tests scripts

  deployment-staging:
    name: Protected deployment staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load disposable fixture image
        run: docker pull ubuntu:24.04
      - name: Exercise real root helper without network or production services
        run: python3 scripts/validate_deploy_staging.py --runtime docker

  backend:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    # Typically 3-4 minutes; up to ~14 when the apt mirror is slow.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Retry stalled apt downloads
        # Config file, so apt calls made by playwright install-deps / --with-deps retry too.
        run: echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Verify pinned production requirements export
        run: |
          uv export --locked --no-dev --no-emit-project --no-annotate --format requirements-txt > "$RUNNER_TEMP/requirements-production.txt"
          diff -u requirements-production.txt "$RUNNER_TEMP/requirements-production.txt"
      - name: Run application and static-site tests
        # Hosted report tests use the same browser renderer as production.
        # Install its pinned executable rather than relying on runner caches.
        run: |
          uv run --locked python -m playwright install --with-deps chromium --only-shell
          uv run --locked python -m pytest -q
