name: Test Daedalus

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  # Superseded PR pushes cancel; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Check Python sources
        # Pinned tool run; the lockfile and production requirements stay unchanged.
        run: uvx ruff@0.14.1 check src tests scripts
      - name: Check JavaScript syntax
        run: find src/daedalus tests -name '*.js' -print0 | xargs -0 -n1 node --check

  deployment-staging:
    name: Protected deployment staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load disposable fixture image
        run: docker pull ubuntu:24.04
      - name: Exercise real root helper without network or production services
        run: python3 scripts/validate_deploy_staging.py --runtime docker

  backend:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    # Typically 3-4 minutes; longer only on a cache miss with a slow apt mirror.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Prepare CI package cache directory
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" /opt/ci-cache
      - name: Restore apt/pip package cache
        # The apt mirror sometimes serves at ~75 kB/s; cached .debs skip that download.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/ci-cache
          key: apt-${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('uv.lock') }}
          restore-keys: |
            apt-${{ runner.os }}-${{ runner.arch }}-playwright-
      - name: Configure apt retries and package cache
        # Config files, so apt calls made by playwright install-deps / --with-deps use them too.
        run: |
          mkdir -p /opt/ci-cache/apt/partial /opt/ci-cache/pip
          chmod -R a+rwX /opt/ci-cache  # writable by disposable test users too
          printf '%s\n' 'Acquire::Retries "5";' 'Dir::Cache::Archives "/opt/ci-cache/apt";' \
            'APT::Sandbox::User "root";' 'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
            | sudo tee /etc/apt/apt.conf.d/80-ci
          printf '[global]\ncache-dir = /opt/ci-cache/pip\n' | sudo tee /etc/pip.conf
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Verify pinned production requirements export
        run: |
          uv export --locked --no-dev --no-emit-project --no-annotate --format requirements-txt > "$RUNNER_TEMP/requirements-production.txt"
          diff -u requirements-production.txt "$RUNNER_TEMP/requirements-production.txt"
      - name: Run application and static-site tests
        # Hosted report tests use the same browser renderer as production.
        # Install its pinned executable rather than relying on runner caches.
        run: |
          uv run --locked python -m playwright install --with-deps chromium --only-shell
          uv run --locked python -m pytest -q
      - name: Make package cache readable for saving
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" /opt/ci-cache && sudo chmod -R a+rwX /opt/ci-cache
