name: Test managed Linux scanner

on:
  push:
    branches: [main]
    paths:
      - 'src/daedalus/**'
      - 'pyproject.toml'
      - 'requirements-production.txt'
      - 'scripts/validate_scanner_local.py'
      - '.github/workflows/linux-scanner-managed.yml'
  pull_request:
    paths:
      - 'src/daedalus/**'
      - 'pyproject.toml'
      - 'requirements-production.txt'
      - 'scripts/validate_scanner_local.py'
      - '.github/workflows/linux-scanner-managed.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-managed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  managed:
    name: Managed scanner — ${{ matrix.scenario }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: [lifecycle, repeat-comparison, listener-change, multi-host-change, interrupted-bridge]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-venv nmap unzip dbus-user-session build-essential python3-dev
      - name: Validate with a disposable user and an isolated portal
        shell: bash
        env:
          SCANNER_VALIDATION_SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          scenario_args=()
          case "$SCANNER_VALIDATION_SCENARIO" in
            lifecycle) scenario_args+=(--managed-linux) ;;
            repeat-comparison) scenario_args+=(--repeat-scan) ;;
            listener-change) scenario_args+=(--repeat-scan --close-listener) ;;
            multi-host-change) scenario_args+=(--repeat-scan --close-listener --multi-host) ;;
            interrupted-bridge) scenario_args+=(--interrupt-bridge) ;;
            *) exit 1 ;;
          esac
          sudo useradd --create-home --shell /bin/bash daedalusqa
          qa_uid=$(id -u daedalusqa)
          cleanup() {
            if sudo test -f /home/daedalusqa/managed-scanner.json; then
              sudo cat /home/daedalusqa/managed-scanner.json
              sudo install -m 0644 /home/daedalusqa/managed-scanner.json "$RUNNER_TEMP/managed-scanner.json"
            fi
            if sudo test -f /home/daedalusqa/managed-scanner.pdf; then
              sudo install -m 0644 /home/daedalusqa/managed-scanner.pdf "$RUNNER_TEMP/managed-scanner.pdf"
            fi
            sudo systemctl stop "user@${qa_uid}.service" || true
            sudo loginctl disable-linger daedalusqa || true
            sudo userdel --remove daedalusqa || true
          }
          trap cleanup EXIT
          sudo mkdir /home/daedalusqa/project
          git archive HEAD | sudo tar -x -C /home/daedalusqa/project
          sudo chown -R daedalusqa:daedalusqa /home/daedalusqa/project
          sudo loginctl enable-linger daedalusqa
          sudo systemctl start "user@${qa_uid}.service"
          sudo runuser -u daedalusqa -- python3 -m venv /home/daedalusqa/project/.venv
          sudo runuser -u daedalusqa -- /home/daedalusqa/project/.venv/bin/pip install \
            -r /home/daedalusqa/project/requirements-production.txt
          sudo runuser -u daedalusqa -- /home/daedalusqa/project/.venv/bin/pip install \
            --no-deps /home/daedalusqa/project
          sudo /home/daedalusqa/project/.venv/bin/python -m playwright install-deps chromium
          sudo runuser -u daedalusqa -- /home/daedalusqa/project/.venv/bin/python -m playwright install chromium --only-shell
          scanner_python=/home/daedalusqa/project/.venv/bin/python
          if [ "$SCANNER_VALIDATION_SCENARIO" != lifecycle ]; then
            sudo runuser -u daedalusqa -- python3 -m venv /home/daedalusqa/nmapui-runtime
            sudo runuser -u daedalusqa -- bash -c 'unzip -p /home/daedalusqa/project/src/daedalus/agent_bundle/nmapui-source.zip daedalus-nmapui-source/requirements.txt > /home/daedalusqa/nmapui-requirements.txt'
            sudo runuser -u daedalusqa -- /home/daedalusqa/nmapui-runtime/bin/pip install \
              -r /home/daedalusqa/nmapui-requirements.txt
            scanner_python=/home/daedalusqa/nmapui-runtime/bin/python
          fi
          sudo runuser -u daedalusqa -- env \
            XDG_CONFIG_HOME="/home/daedalusqa/.config" \
            XDG_DATA_HOME="/home/daedalusqa/.local/share" \
            XDG_RUNTIME_DIR="/run/user/${qa_uid}" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/${qa_uid}/bus" \
            /home/daedalusqa/project/.venv/bin/python \
              /home/daedalusqa/project/scripts/validate_scanner_local.py \
              --run-loopback \
              "${scenario_args[@]}" \
              --nmapui-python "$scanner_python" \
              --receipt /home/daedalusqa/managed-scanner.json
      - name: Retain isolated scanner evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: managed-linux-scanner-evidence-${{ matrix.scenario }}
          path: |
            ${{ runner.temp }}/managed-scanner.json
            ${{ runner.temp }}/managed-scanner.pdf
          if-no-files-found: warn
          retention-days: 14
